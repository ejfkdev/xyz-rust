[package]
name = "xyz-rust-macros"
version = "0.3.1"
edition = "2024"
description = "Derive macros for xyz-rust（XyzArgs / XyzScalar / XyzOutput）"
license = "MIT"
repository = "https://github.com/ejfkdev/xyz-rust"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"